# CED mechanistic-distillation config (Batch 1: instrumentation only, NO training runs).
# Mirrors src/training/ced_distill.py::DistillLossConfig / FreezePolicy / BudgetTracker.
name: kestrel-qwen35-ced

sources:
  student_id: Qwen/Qwen3.5-2B-Base
  student_revision: b1485b2fa6dfa1287294f269f5fb618e03d52d7c # pinned 2026-09-13, HF metadata
  teacher_id: Qwen/Qwen3.5-9B
  teacher_revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a # pinned 2026-09-13, HF metadata
  # Revisions are pinned (no floating refs). Verified 2026-09-13 via HF Hub (free metadata):
  # 2B text_config: hidden 2048, 24 layers, 8 Q / 2 KV heads, head_dim 256, vocab 248320,
  #   max_pos 262144, tie_word_embeddings=true.
  # 9B text_config: hidden 4096, 32 layers, 16 Q / 4 KV heads, head_dim 256, vocab 248320,
  #   max_pos 262144, tie_word_embeddings=false.
  # Special tokens: identical IDs both sides (endoftext=248044, im_start=248045,
  #   im_end=248046; image=248056, video=248057, vision span 248053-248054).
  # Divergence is default-eos STRING only: 2B-Base defaults eos to <|endoftext|> (248044),
  # 9B post-trained defaults eos to <|im_end|> (248046). Policy: generation uses the
  # DECODER eos (248046); prefill accepts both. check_tokenizer_compatibility passes on IDs.

arch:
  student_hidden: 2048
  student_layers: 24
  student_q_heads: 8
  student_kv_heads: 2
  teacher_hidden: 4096
  teacher_layers: 32
  teacher_q_heads: 16
  teacher_kv_heads: 4
  head_dim: 256
  vocab_size: 248320 # padded embedding rows (text_config). Tokenizer length is
  tokenizer_vocab_size: 248077 # len(tokenizer), identical both sides (L4 smoke 2026-09-13)
  max_position_embeddings: 262144

loss:
  w_ce: 1.0
  w_kl: 1.0
  w_hidden: 0.5
  w_attn: 0.5
  w_kv: 0.25
  w_index: 0.25
  temperature: 1.0
  # Hidden/attention matching subset only -- never full retention by default.
  selected_layers: [4, 8, 12, 16, 20]

freeze_stages:
  - bridge_only
  - bridge_global_kv
  - lora_recovery
  - selective_unfreeze

compute_budget:
  max_gpu_hours: 50
  gpu_class: a100_80gb
  hard_stop: true
